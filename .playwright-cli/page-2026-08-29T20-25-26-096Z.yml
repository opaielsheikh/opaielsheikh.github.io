            - subscript [ref=e346]: t
          - text: "represents events that can occur independently of the agent. For training, time can be accelerated: a real three-hour wait may become three simulated minutes while preserving the ordering and consequences of events."
        - heading "Tool interfaces and checkpointing" [level=3] [ref=e347]
        - paragraph [ref=e348]: A strong twelve-hour environment should mix APIs, computer use, terminals, filesystems, databases, and messaging while keeping them connected to the same underlying state. If the agent sends an email, the inbox should change. If it edits a repository, later tests should use the new code. If it approves something, another actor should be able to observe that decision. The tools should not become isolated mini-games; they should be different interfaces to one persistent world.
        - paragraph [ref=e349]: Checkpointing makes the environment survivable. A checkpoint might store the current world time, state version, goal, plan step, pending job, artifacts, and memory snapshot. If execution disappears, the system can reload the checkpoint, reconstruct the working context, and continue from the same step rather than replaying six hours of conversation.
        - code [ref=e351]: crash ↓ reload checkpoint ↓ reconstruct context ↓ continue safely
        - paragraph [ref=e352]: Recovery should be a normal state transition, not an exceptional failure. The model can crash, change, lose its context, or go offline; the environment should still know what happened, what time it is, which events are pending, which actions occurred, what artifacts exist, and where the agent should resume.
        - heading "Evaluators" [level=3] [ref=e353]
        - paragraph [ref=e354]: Finally, the environment needs evaluators that inspect both the trajectory and the final world state. A primary verifier might check that tests pass, required functionality works, credentials were not exposed, the repository was not corrupted, and the task objective was satisfied. Diagnostic metrics—tool calls, tokens consumed, elapsed world time, retries, policy violations, human interventions, and recovery events—can be recorded separately rather than all being placed inside the reward.
        - paragraph [ref=e355]:
          - text: The complete design is less like
          - code [ref=e356]: LLM runs for 12 hours
          - text: and more like
          - code [ref=e357]: wake → observe → reason → act → persist → wait → event → wake → recover → continue
          - text: . The environment lasts twelve hours. The model does not have to.
        - heading "Training on Long-Horizon Environments" [level=2] [ref=e358]
        - paragraph [ref=e359]: Building a twelve-hour environment is only half the problem. The harder question is how to train a model inside it. A short reasoning task may generate a few hundred tokens before receiving a reward; a long-horizon agent may generate thousands of tool calls, observations, plans, artifacts, retries, and decisions before the final outcome is known.
        - paragraph [ref=e360]: "Training is therefore better understood as a pipeline than as one enormous RL run:"
        - code [ref=e362]: good trajectories → SFT → short-horizon RL → curriculum → longer rollouts → offline reuse → long-horizon RL
        - paragraph [ref=e363]: The practical goal is to first teach the model what competent behavior looks like, then let reinforcement learning improve how it behaves when it reaches states that demonstrations did not cover.
        - heading "SFT from trajectories" [level=3] [ref=e364]
        - paragraph [ref=e365]: "Supervised fine-tuning is a useful place to start. A successful long-horizon trajectory should not be treated as one enormous input-output pair. It can be decomposed into many state-action examples. If an expert reads a policy, requests evidence, waits for a reply, identifies a contradiction, and makes a final decision, every transition can become training data:"
        - code [ref=e367]:
