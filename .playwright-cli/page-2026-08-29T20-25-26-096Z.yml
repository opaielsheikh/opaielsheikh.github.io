          - text: .
        - paragraph [ref=e435]: Intermediate rewards should correspond to meaningful, independently verifiable state changes rather than arbitrary signals such as “used the right tool.” Otherwise, hierarchy creates more surfaces for reward hacking instead of making failure interpretable.
        - heading "A practical training stack" [level=3] [ref=e436]
        - paragraph [ref=e437]: "Putting the pieces together, a practical long-horizon training setup might look like:"
        - code [ref=e439]: environment platform → parallel trajectories → trajectory store → SFT + offline learning → on-policy RL / distillation → curriculum increases horizon → new trajectories → repeat
        - paragraph [ref=e440]: The environment platform supplies states, sandboxes, tools, and verifiers. A training system supplies SFT, RL, distillation, optimizer steps, and checkpointing. Prime Intellect is most relevant when the environment itself is central to the experiment, while Tinker represents a programmable training layer where the researcher provides the data, environment, loss, and loop.
        - paragraph [ref=e441]:
          - text: "The central insight is that training on long-horizon environments should be a continual improvement loop:"
          - code [ref=e442]: collect → filter → imitate → explore → evaluate → increase horizon → repeat
          - text: . SFT teaches the shape of successful work. RL teaches recovery when the agent leaves that distribution. Offline methods make expensive trajectories reusable. Curriculum makes exploration tractable. Hierarchical credit assignment makes failure interpretable.
        - paragraph [ref=e443]:
          - text: For long-horizon agents, the scarce resource may eventually be less the gradient update itself and more the
          - strong [ref=e444]: high-quality trajectory through a consequential world
          - text: .
        - heading "Evaluating Long-Horizon Agents" [level=2] [ref=e445]
        - paragraph [ref=e446]: "Training reward tells us whether a policy is improving. Evaluation asks a harder question: does the trained agent actually behave better across complete long-horizon trajectories it has not seen before?"
        - paragraph [ref=e447]: For a twelve-hour agent, final accuracy alone is not enough. Two agents can reach the same outcome while one wastes compute, repeats work, violates constraints, or succeeds only after recovering from several serious mistakes.
        - heading "Task success" [level=3] [ref=e448]
        - paragraph [ref=e449]:
          - text: "Start with the clearest signal:"
          - code [ref=e450]: "Success ∈ {0, 1}"
          - text: . Did the agent actually complete the task? For coding, this might mean hidden tests pass. For an insurance workflow, the final decision and required state transitions must be correct. Wherever possible, this evaluator should be objective and externally verifiable.
        - heading "Trajectory quality" [level=3] [ref=e451]
        - paragraph [ref=e452]:
          - text: Then inspect how the agent got there. A trajectory evaluator can look for unnecessary loops, repeated actions, poor information gathering, premature commitments, bad intermediate decisions, or actions that happened to work despite weak reasoning. The object being evaluated is therefore the complete trajectory,
          - code [ref=e453]:
            - text: τ = (s
