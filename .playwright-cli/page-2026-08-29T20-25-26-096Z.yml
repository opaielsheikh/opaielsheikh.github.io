        - heading "Prompt-local state" [level=3] [ref=e129]
        - paragraph [ref=e130]: "The simplest architecture keeps state inside the prompt: instructions, conversation history, and recent tool outputs are passed back to the model on every step. This is easy to build and often sufficient for a bounded coding session or a short research question. Its weakness is that the context window carries too much responsibility. If the process crashes, the history is truncated, or the agent returns tomorrow, important state may disappear. Prompt-local state is useful as working memory, but it is a poor source of truth for a long-running environment."
        - heading "Persistent state" [level=3] [ref=e131]
        - paragraph [ref=e132]:
          - text: "Persistent state separates the agent’s temporary execution from the information that must survive. Plans, task status, files, job identifiers, decisions, checkpoints, and permissions can be written to durable storage. The model may stop running while the agent continues to exist conceptually: it can wake, load its state, perform work, checkpoint, sleep, and wake again after an event."
          - link "Cloudflare Agents" [ref=e133] [cursor=pointer]:
            - /url: https://developers.cloudflare.com/agents/concepts/agentic-patterns/long-running-agents/
          - text: are a useful production reference for this pattern, while the updated
          - link "OpenAI Agents SDK" [ref=e134] [cursor=pointer]:
            - /url: https://openai.com/index/the-next-evolution-of-the-agents-sdk/
          - text: describes externalized state, sandbox snapshots, and rehydration for long-running work.
        - figure [ref=e135]:
          - img "Diagram showing external systems feeding activities, temporal history, and an agent." [ref=e136]
        - paragraph [ref=e137]: The design challenge is deciding what must be durable. A full transcript may be unnecessary, while a pending payment, a decision rationale, or the identifier of an external job may be essential. The goal is not to preserve everything. It is to preserve the information needed to reconstruct the agent’s situation and continue safely.
        - heading "Distributed state" [level=3] [ref=e138]
        - paragraph [ref=e139]:
          - text: Production environments rarely have a single
          - code [ref=e140]: world_state.json
          - text: . An insurance agent might depend on a claims database, email, document storage, a CRM, a payment system, and several external APIs. The true state is distributed across systems owned by different teams, each with its own latency, permissions, failure modes, and consistency guarantees.
        - figure [ref=e141]:
          - img "Diagram showing an agent connected to a claims database, email, document store, CRM, payment system, and external APIs." [ref=e142]
        - paragraph [ref=e143]:
          - text: "This introduces classic distributed-systems problems into agent design: stale reads, concurrent writes, duplicate events, retries, partial failures, and eventual consistency."
          - link "Temporal" [ref=e144] [cursor=pointer]:
            - /url: https://temporal.io/
          - text: is a useful reference because it separates durable workflow history from the activities that perform side effects. The workflow can remember what happened and retry safely even when an API or worker disappears. For agents, this is the difference between resuming from a checkpoint and starting the entire task again.
        - heading "Partially observable state" [level=3] [ref=e145]
        - paragraph [ref=e146]:
          - text: In many environments, the agent should not see the complete world state. A cybersecurity investigation, insurance review, negotiation, or scientific experiment may contain hidden facts that must be inferred from evidence. The environment has a true state
          - code [ref=e147]:
            - text: S
            - subscript [ref=e148]: t
          - text: ", but exposes only an observation"
          - code [ref=e149]:
            - text: O
            - subscript [ref=e150]: t
            - text: = g(S
            - subscript [ref=e151]: t
            - text: )
          - text: ". The agent then maintains a belief about the world based on its observation history and previous actions:"
          - code [ref=e152]:
            - text: B
            - subscript [ref=e153]: t
            - text: = P(S
            - subscript [ref=e154]: t
