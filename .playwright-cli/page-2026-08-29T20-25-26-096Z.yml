        - paragraph [ref=e20]: Agentic AI
        - heading "The Architecture of Long-Horizon Agents" [level=1] [ref=e21]
        - paragraph [ref=e22]: An environment-first guide to persistent state, memory, tools, rewards, training, and evaluation for agents that operate over hours or days.
        - paragraph [ref=e23]: August 25, 2026 · Opai Elsheikh
      - generic [ref=e26]:
        - paragraph [ref=e27]:
          - text: "Reinforcement learning is built around a simple idea: an agent improves by acting in an environment and learning from feedback. Its foundations are described in"
          - link [ref=e28] [cursor=pointer]:
            - /url: https://mitpress.mit.edu/9780262039246/reinforcement-learning/
            - text: Sutton and Barto’s
            - emphasis [ref=e29]: "Reinforcement Learning: An Introduction"
          - text: . Early systems usually worked in small environments with short episodes and clear rewards.
        - paragraph [ref=e30]:
          - text: Deep learning made these systems far more capable.
          - link "AlphaGo" [ref=e31] [cursor=pointer]:
            - /url: https://www.nature.com/articles/nature16961
          - text: combined neural networks, self-play, and search, while
          - link "AlphaGo Zero" [ref=e32] [cursor=pointer]:
            - /url: https://www.nature.com/articles/nature24270
          - text: learned from the rules and self-play alone.
          - link "OpenAI Five" [ref=e33] [cursor=pointer]:
            - /url: https://openai.com/index/openai-five/
          - text: showed that RL could also handle real-time, multi-agent environments with delayed consequences.
        - paragraph [ref=e34]:
          - text: Language models also changed how agents are trained and improved.
          - link "DeepSeek’s GRPO" [ref=e35] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2402.03300
          - text: uses relative rewards across sampled solutions to improve reasoning, while Thinking Machines Lab’s work on
          - link "on-policy distillation" [ref=e36] [cursor=pointer]:
            - /url: https://thinkingmachines.ai/blog/on-policy-distillation/
          - text: studies how a smaller model can learn from a stronger teacher while generating its own training experience. Together, these methods point toward agents that can reason, act, and improve through repeated interaction.
        - paragraph [ref=e37]: These advances reveal the difference between a convincing demo and reliable long-horizon behavior. Tasks lasting hours or days require persistent state, useful memory, external events, side-effectful tools, recovery, and delayed rewards. The environment determines what the agent can observe, change, and remember.
        - paragraph [ref=e38]: This article takes an environment-first view. We will cover state, time, events, actions, memory, rewards, tools, multi-agent settings, credit assignment, failure modes, training, evaluation, and the path from isolated tasks to persistent worlds.
        - heading "From Tasks to Environments" [level=2] [ref=e39]
        - figure [ref=e40]:
          - img "Diagram comparing a static task with a persistent environment containing an agent, tools, memory, world state, external events, other actors, and time." [ref=e41]
        - paragraph [ref=e42]:
          - text: A normal benchmark task is often presented as a prompt, a fixed set of tools, a sequence of actions, and a final answer. This works well when the task is short and the world remains unchanged while the model is reasoning. For example, a coding benchmark may give an agent a GitHub issue and ask it to produce a patch, as in
          - link "SWE-bench" [ref=e43] [cursor=pointer]:
            - /url: https://github.com/SWE-bench/SWE-bench
          - text: .
        - paragraph [ref=e44]:
          - text: That abstraction becomes weaker as the horizon grows. If an agent works for twelve hours or three days, new information arrives, tools change state, people respond later, and earlier decisions affect what becomes possible next. A pull request can receive review comments, a test pipeline can fail after a delay, or a business workflow can wait for a human response. Systems such as
          - link "GitHub Actions" [ref=e45] [cursor=pointer]:
            - /url: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
          - text: and
          - link "AWS Step Functions" [ref=e46] [cursor=pointer]:
            - /url: https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html
          - text: are useful examples of software environments where events and state continue to evolve over time.
        - paragraph [ref=e47]:
          - text: An environment is therefore more than a task description. It is a persistent world containing state, tools, time, external events, constraints, and consequences. This is closely related to the
          - link "Harbor framework" [ref=e48] [cursor=pointer]:
            - /url: https://github.com/harbor-framework/harbor
          - text: ", which is used for running agent evaluations and RL environments. Harbor packages an instruction, an environment, and a verifier; the JSON below is a simplified, Harbor-style representation of a long-horizon coding task:"
        - generic [ref=e49]:
          - button "Copy JSON" [ref=e50] [cursor=pointer]
          - code [ref=e52]: "{ \"task_id\": \"checkout-auth-001\", \"instruction\": \"Fix the failing authentication test\", \"environment\": { \"image\": \"checkout-service:latest\", \"os\": \"linux\", \"working_directory\": \"/workspace\", \"resources\": {\"cpu\": 4, \"memory_gb\": 16} }, \"initial_state\": { \"repository\": \"checkout-service\", \"branch\": \"agent/fix-auth\", \"tests\": {\"authentication\": \"failing\"} }, \"tools\": [\"terminal\", \"git\", \"test_runner\"], \"external_events\": [\"review_comment_received\", \"ci_run_finished\"], \"constraints\": [\"do not expose credentials\"], \"verifier\": {\"tests_pass\": 1, \"regression\": -1} }"
        - paragraph [ref=e53]: "The key distinction is between what the model currently sees and what is actually true. The context window contains the agent’s current observation: perhaps the latest test output, one review comment, and a small portion of the repository. The environment contains the complete state of the world, including files not yet opened, pending events, hidden constraints, and consequences from earlier actions. Long-horizon agents must repeatedly observe the environment and update their beliefs instead of treating the first prompt as a complete description."
        - paragraph [ref=e54]: A task gives an agent something to solve. An environment gives it somewhere to operate. For long-horizon agents, that distinction is fundamental. Evaluation must therefore move beyond asking, “Can the model solve this task?” and ask, “Can the agent operate correctly inside a changing world over time?”
        - heading "The Core Architecture of a Long-Horizon Environment" [level=2] [ref=e55]
        - paragraph [ref=e56]: "A long-horizon environment is not just an LLM connected to a larger collection of tools. It is a system that persists, changes, and records consequences while the agent works inside it. The agent sees only an observation of that system, acts through an interface, and is eventually judged on a trajectory that may span hours or days. Most such environments can be understood through six primitives: state, time, events, actions, memory, and rewards."
        - figure [ref=e57]:
          - img "Diagram showing events, memory, an agent, actions, state, observations, time, and delayed rewards in a long-horizon environment." [ref=e58]
        - heading "State" [level=3] [ref=e59]
        - paragraph [ref=e60]:
          - text: State is the source of truth for the world. It is not the model’s context window and it is not the conversation transcript. It can include files, database rows, emails, account balances, open cases, task progress, permissions, and decisions already made. A useful abstraction is
          - code [ref=e61]:
            - text: S
            - subscript [ref=e62]: t
          - text: ", the world state at time"
          - code [ref=e63]: t
          - text: . When the agent takes an action, it changes the conditions from which the next action must be chosen. A reliable environment therefore needs durable state that can be inspected, updated, and recovered independently of the model process.
        - heading "Time" [level=3] [ref=e64]
        - paragraph [ref=e65]: "Long-horizon systems have two clocks. Agent time counts reasoning steps, messages, and tool calls. World time counts hours, deadlines, waiting periods, and background processes. These clocks do not have to move together: an agent may make no call for four hours while a deadline approaches or a job finishes. This is why an environment needs explicit support for waiting, scheduled actions, timeouts, and sometimes accelerated simulation. Without world time, a long task is only a long transcript."
        - heading "Events" [level=3] [ref=e66]
        - paragraph [ref=e67]:
          - text: Events are changes that do not necessarily originate from the agent. An email can arrive, a customer can reply, an experiment can finish, another employee can edit a file, an API can fail, or a price can move. A simple transition model is
          - code [ref=e68]:
            - text: S
            - subscript [ref=e69]: t+1
            - text: = f(S
            - subscript [ref=e70]: t
            - text: ", A"
            - subscript [ref=e71]: t
            - text: ", E"
            - subscript [ref=e72]: t
            - text: )
          - text: ", where"
          - code [ref=e73]:
            - text: A
            - subscript [ref=e74]: t
          - text: is the agent’s action and
          - code [ref=e75]:
            - text: E
            - subscript [ref=e76]: t
          - text: "is the external event stream. This makes the environment genuinely dynamic: it can change while the agent is reasoning, waiting, or offline."
        - heading "Actions" [level=3] [ref=e77]
        - paragraph [ref=e78]: Actions are the interface through which the agent changes the environment. They are not all equally consequential. Reading a database is different from approving a claim; searching a repository is different from merging a pull request. Actions can have cost, latency, permissions, side effects, reversibility, and downstream consequences. The most interesting long-horizon environments are those in which an action changes the future decision space. The agent must consider not only whether a tool call succeeds, but what options it removes or creates later.
        - heading "Memory" [level=3] [ref=e79]
        - paragraph [ref=e80]: Memory belongs to the agent, while state belongs to the environment. The world may contain thousands of emails, but the agent may need to retain only three critical facts and the evidence supporting them. Useful memory can be divided into working memory for the current subtask, episodic memory for past events, semantic memory for durable knowledge, and artifact memory for files or other outputs. The central design problem is deciding what to preserve, what to compress, and what to retrieve later. Placing an entire three-day trajectory into the context window is not a memory architecture.
        - heading "Rewards" [level=3] [ref=e81]
        - paragraph [ref=e82]:
          - text: "Rewards determine which trajectories are worth repeating. In a short task, the reward may be equivalent to a correct final answer. In a long task, evaluation often needs to combine outcome quality, efficiency, constraint adherence, and process quality:"
          - code [ref=e83]:
            - text: R(τ) = R
            - subscript [ref=e84]: outcome
            - text: + R
            - subscript [ref=e85]: efficiency
            - text: + R
            - subscript [ref=e86]: constraints
            - text: + R
            - subscript [ref=e87]: process
          - text: . An insurance agent, for example, might reach the correct decision but still perform poorly if it requested unnecessary documents, violated policy, or communicated an incorrect explanation. The environment must evaluate how success was achieved, not only the final state.
        - paragraph [ref=e88]: These six components form the substrate of a long-horizon environment. State gives the world persistence, time lets it evolve, events introduce change, actions create consequences, memory gives the agent continuity, and rewards determine which trajectories are worth learning from.
        - heading "State Architectures" [level=2] [ref=e89]
        - paragraph [ref=e90]: The important question is not only what state exists, but where it lives and who owns it. A short agent loop can treat the prompt as its working state. An agent that runs for days cannot. As the horizon grows, state moves outward—from the context window into checkpoints, databases, workflow histories, and external systems. The architecture determines whether the agent can resume after failure, coordinate with other actors, and distinguish an old observation from the current world.
