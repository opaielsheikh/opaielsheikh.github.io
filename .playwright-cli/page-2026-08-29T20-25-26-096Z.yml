            - text: ", a"
            - subscript [ref=e455]: "0"
            - text: ", …, s"
            - subscript [ref=e456]: T
            - text: )
          - text: ", not merely the final answer."
        - heading "Efficiency and recovery" [level=3] [ref=e457]
        - paragraph [ref=e458]: "Long-horizon environments should record the cost of success: tool calls, tokens, world time, compute, retries, and unnecessary actions. Recovery is especially important. If the environment changes unexpectedly or an early decision fails, can the agent recognize the failure, update its plan, and continue?"
        - paragraph [ref=e459]:
          - text: A useful agent is not one that never fails. It is one that can
          - strong [ref=e460]: fail without losing the entire trajectory
          - text: .
        - heading "Constraint adherence and delayed consequences" [level=3] [ref=e461]
        - paragraph [ref=e462]: Some failures should invalidate an otherwise successful trajectory. An agent might solve a coding task while exposing credentials, approve the correct claim while violating procedure, or finish quickly by taking an unauthorized shortcut.
        - paragraph [ref=e463]:
          - text: "Some consequences appear only later. Evaluation should be able to advance the environment after the apparent completion point and check whether earlier actions created delayed failures:"
          - code [ref=e464]:
            - text: action
            - subscript [ref=e465]: t
            - text: → consequence
            - subscript [ref=e466]: t+k
          - text: . A policy that leaves the world in a dangerous state should not receive full credit merely because the immediate task appeared complete.
        - heading "Evaluating after training with Prime Intellect" [level=3] [ref=e467]
        - paragraph [ref=e468]:
          - link "Prime Intellect" [ref=e469] [cursor=pointer]:
            - /url: https://www.primeintellect.ai/
          - text: provides a useful implementation of this loop. Its
          - link "Verifiers" [ref=e470] [cursor=pointer]:
            - /url: https://github.com/PrimeIntellect-ai/verifiers
          - text: framework defines tasksets, tools, harnesses, runtimes, and scoring rubrics, so the same environment can be used during training and evaluation.
        - paragraph [ref=e471]: After training a policy, it can be run through held-out environments in parallel. In this setup, the platform handles inference, sandboxes, rollout execution, and result collection, while the environment evaluator or rubric determines performance.
        - paragraph [ref=e472]: This makes the train → evaluate → inspect → retrain loop part of the same stack. For long-horizon agents, the final question should not simply be, “Did it finish?”
        - heading "What Should We Build Next?" [level=2] [ref=e473]
        - paragraph [ref=e474]: The most interesting long-horizon environments are not short tasks artificially stretched to make them harder. They are domains where the real work already unfolds over hours, days, weeks, or months. These environments naturally contain waiting, external events, changing state, multiple actors, delayed consequences, and decisions that cannot always be reversed.
        - heading "Insurance" [level=3] [ref=e475]
        - paragraph [ref=e476]: "Insurance is one of the clearest places to start. A claim is a persistent process: an adjuster collects evidence, reads policies, contacts the claimant, waits for documents, handles inconsistencies, updates reserves, checks coverage, and eventually decides whether and how much to pay."
        - paragraph [ref=e477]: An insurance agent could remain attached to a claim throughout its lifecycle. It might work for twenty minutes, wait six hours for a document, wake when the document arrives, update its understanding, request more evidence, and eventually make a consequential decision. That is a genuine long-horizon environment.
        - paragraph [ref=e478]:
          - link "Guidewire" [ref=e479] [cursor=pointer]:
            - /url: https://www.guidewire.com/
          - text: is already moving toward agentic infrastructure across policy, claims, and billing systems. The deeper research opportunity is not simply making claims faster; it is evaluating whether an agent can maintain a correct belief for several days, handle contradictory evidence, respect authorization constraints, communicate appropriately, recover from mistakes, and understand the financial consequences of its decisions.
        - heading "Legal" [level=3] [ref=e480]
        - paragraph [ref=e481]: Legal work is naturally sequential. A contract can move through drafting, review, negotiation, counterparty comments, revision, approval, execution, and later interpretation. A litigation matter can evolve over months as new evidence appears, opposing counsel responds, deadlines change, and earlier decisions affect later options.
        - paragraph [ref=e482]:
          - link "Harvey’s Legal Agent Benchmark" [ref=e483] [cursor=pointer]:
            - /url: https://www.harvey.ai/
          - text: "is a useful example of vertical evaluation: instead of asking isolated legal questions, it gives an agent a client matter containing multiple documents and asks it to produce actual legal work product. The same pattern could extend to insurance, finance, compliance, and healthcare operations."
        - heading "Manufacturing" [level=3] [ref=e484]
        - paragraph [ref=e485]: Manufacturing is an almost perfect long-horizon environment because the world never stops. Machines produce telemetry, equipment degrades, parts arrive late, quality issues appear, workers change shifts, and production schedules move. Maintenance decisions made in the morning may affect throughput twelve hours later.
        - paragraph [ref=e486]:
          - text: Instead of asking an agent to diagnose one machine failure, the environment could ask it to operate a production line for twelve simulated hours while maximizing throughput, maintaining quality, responding to failures, and staying inside safety constraints.
          - link "NVIDIA’s factory-operations work" [ref=e487] [cursor=pointer]:
            - /url: https://www.nvidia.com/en-us/omniverse/solutions/factory-operations/
          - text: points toward this kind of continuously observing and orchestrating agent.
        - heading "Farming" [level=3] [ref=e488]
        - paragraph [ref=e489]: A farm pushes the horizon even further. Weather, soil, crop health, machinery, labor, irrigation, disease, input prices, and biological processes evolve continuously, while some decisions have consequences that appear days or months later.
        - paragraph [ref=e490]:
          - text: A genuinely ambitious benchmark would not ask, “Identify weeds in this image?” It would ask, “Manage this farm for an entire simulated growing season.” The agent would coordinate irrigation, respond to disease pressure, reschedule work around weather, operate machinery, and learn from outcomes across the season. Platforms such as
          - link "John Deere Operations Center" [ref=e491] [cursor=pointer]:
            - /url: https://www.deere.com/en/technology-products/operations-center/
          - text: show how machine, field, and environmental data can become the state and action interfaces for such an environment.
        - heading "Scientific research" [level=3] [ref=e492]
        - paragraph [ref=e493]: "Scientific research forms a long loop: an agent proposes a hypothesis, modifies code, launches an experiment, waits for results, analyzes failures, reads related work, changes direction, and runs another experiment. The objective itself may change as evidence accumulates."
        - paragraph [ref=e494]: This is an area where final answers are especially incomplete. Evaluation needs to inspect how an agent frames problems, executes experiments, responds to feedback, reuses previous experience, and decides when to abandon an unproductive direction. A research environment should measure sustained exploration and the quality of the investigation, not only whether the final report sounds plausible.
        - heading "Chip design" [level=3] [ref=e495]
        - paragraph [ref=e496]: Chip design is another strong example of long-horizon engineering becoming agentic. An agent may generate RTL, run simulations, inspect failures, change the design, rerun verification, and iterate toward design closure while balancing power, performance, and area. Those loops already take humans days or weeks.
        - paragraph [ref=e497]:
          - link "Cadence" [ref=e498] [cursor=pointer]:
            - /url: https://www.cadence.com/en_US/home/solutions/artificial-intelligence.html
          - text: and
          - link "Synopsys" [ref=e499] [cursor=pointer]:
            - /url: https://www.synopsys.com/ai.html
          - text: both describe increasingly autonomous systems for chip design and verification. A useful benchmark would measure not only whether the final design works, but tool cost, progress over time, recovery from failed simulations, and performance across different stages of the hardware flow.
        - heading "Finance, cybersecurity, and operations" [level=3] [ref=e500]
        - paragraph [ref=e501]: Many other domains have the same structure. A financial operations agent might manage reconciliations, investigate exceptions, wait for counterparties, monitor settlement, and make decisions involving real economic constraints. A cybersecurity agent might investigate an incident for hours, gather evidence from several systems, contain compromised infrastructure, monitor whether the attacker returns, and update its response as telemetry changes. A supply-chain agent could monitor inventory, suppliers, shipping delays, warehouses, and demand continuously.
        - paragraph [ref=e502]:
          - text: The common feature is not the industry. It is the
          - strong [ref=e503]: temporal structure of the work
          - text: ": persistent state, asynchronous events, scarce resources, multiple actors, uncertainty, and delayed consequences."
        - heading "Match the environment horizon to the work" [level=3] [ref=e504]
        - paragraph [ref=e505]: "Instead of building another benchmark where an agent receives a prompt and finishes ten minutes later, we can build persistent environments that represent actual economic and scientific processes. Then we can ask increasingly ambitious questions:"
        - list [ref=e506]:
          - listitem [ref=e507]: Can an agent manage a claim for three days?
          - listitem [ref=e508]: Can it operate a factory for twenty-four hours?
          - listitem [ref=e509]: Can it conduct fifty experiments without losing the research objective?
          - listitem [ref=e510]: Can it manage a farm across a growing season?
          - listitem [ref=e511]: Can it drive a chip from specification toward verification closure?
        - paragraph [ref=e512]:
          - text: The goal is not simply to make benchmarks longer. It is to make the
          - strong [ref=e513]: environment horizon match the natural horizon of the work
          - text: ". That is when long-horizon agents become more than better chatbots: they become systems that can remain responsible for an evolving piece of the world."
        - heading "Conclusion" [level=2] [ref=e514]
        - paragraph [ref=e515]: "The shift from short agent tasks to long-horizon work changes what matters. A capable model is no longer enough. An agent working for hours or days needs a world that persists around it: state that survives restarts, memory that keeps only what matters, events that arrive asynchronously, tools that change the world, checkpoints that enable recovery, and rewards that still mean what we intend after thousands of actions."
        - paragraph [ref=e516]: This is why long-horizon agents increasingly look less like chat systems and more like distributed systems. The model provides reasoning and action selection, but the surrounding environment provides continuity, time, access control, synchronization, observability, and consequences.
        - paragraph [ref=e517]: Training must change as well. Successful trajectories can become supervised fine-tuning data, expensive rollouts can be reused offline, reinforcement learning can improve behavior beyond demonstrations, and curriculum learning can gradually extend the horizon from minutes to hours. Evaluation must also move beyond final accuracy. We should measure whether the agent completed the task, how efficiently it acted, whether it recovered from failure, respected constraints, and left the world in a good state afterward.
        - paragraph [ref=e518]: "The most valuable environments will come from work that is already long-running: insurance claims, legal matters, manufacturing, farming, scientific research, chip design, cybersecurity, and operations."
        - paragraph [ref=e519]: The goal is not to make benchmarks longer for the sake of difficulty. It is to build persistent worlds whose time horizon matches the real work, then train agents that can remain useful, coherent, and accountable inside them. That is the architecture required for agents that truly endure.
