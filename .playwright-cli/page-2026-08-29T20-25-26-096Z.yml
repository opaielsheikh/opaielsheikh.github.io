            - text: ", …, a"
            - subscript [ref=e424]: "1000"
            - text: )
          - text: ", segment it into meaningful subtrajectories"
          - code [ref=e425]:
            - text: τ = (τ
            - subscript [ref=e426]: "1"
            - text: ", τ"
            - subscript [ref=e427]: "2"
            - text: ", …, τ"
            - subscript [ref=e428]: k
            - text: )
          - text: .
        - paragraph [ref=e429]:
          - text: "This lets the trainer ask which subtask caused the failure before asking which individual token caused it. A coding trajectory might be segmented into understanding the issue, locating the bug, designing a patch, implementing it, running tests, repairing failures, and submitting. A hierarchical return can combine final and subtask outcomes:"
          - code [ref=e430]:
