        - paragraph [ref=e271]: The key idea is that the action space itself is part of environment design. Long-horizon agents should not be trained only to call tools. They should learn to operate interfaces, choose between interfaces, understand which actions change persistent state, and recognize when an action cannot safely be undone. The environment is not just a collection of capabilities; it is a controlled world in which actions carry consequences.
        - heading "Reward and Credit Assignment Across Long Horizons" [level=2] [ref=e272]
        - paragraph [ref=e273]:
          - text: "Long-horizon reinforcement learning creates a basic problem: the action that determines success may occur hours before the reward arrives. A trajectory can contain thousands of decisions,"
          - code [ref=e274]:
            - text: τ = (s
            - subscript [ref=e275]: "0"
            - text: ", a"
            - subscript [ref=e276]: "0"
            - text: ", s"
            - subscript [ref=e277]: "1"
            - text: ", a"
            - subscript [ref=e278]: "1"
            - text: ", …, s"
            - subscript [ref=e279]: T
            - text: )
          - text: ", while the environment produces only one final signal. The agent must determine which earlier actions caused that outcome."
        - heading "Sparse final rewards" [level=3] [ref=e280]
        - paragraph [ref=e281]:
          - text: "The cleanest reward is often the final outcome. An insurance agent might investigate a claim for twelve hours before reaching a decision, after which an external verifier checks whether the decision was correct. When the outcome is objectively verifiable, I generally prefer a binary primary reward:"
          - code [ref=e282]: R = 1
          - text: for success and
          - code [ref=e283]: R = 0
          - text: for failure.
        - paragraph [ref=e284]:
          - text: Binary rewards reduce the number of arbitrary preferences encoded into the environment. Instead of deciding that opening a document is worth
          - code [ref=e285]: "+0.1"
          - text: ", sending an email is worth"
          - code [ref=e286]: "+0.3"
          - text: ", and finishing quickly is worth"
          - code [ref=e287]: "+0.5"
          - text: ", the environment asks the harder and more meaningful question: did the agent actually accomplish the task?"
        - paragraph [ref=e288]: Binary does not mean unhackable. If the success verifier has a loophole, the model can still optimize that loophole. The simplicity of the reward only helps when the verifier measures the outcome we actually care about.
        - heading "Intermediate rewards and process supervision" [level=3] [ref=e289]
        - paragraph [ref=e290]: Sparse rewards make credit assignment difficult. If a 500-action task fails at the end, the agent learns that the trajectory was bad but not whether the important mistake happened at step 12, 180, or 497. Intermediate signals can make learning easier, but every signal becomes a new proxy that the policy may optimize in unintended ways.
        - code [ref=e292]: requested correct evidence +0.1 identified a contradiction +0.2 followed authorization policy +0.1 correct final decision +1.0
        - paragraph [ref=e293]: "An agent rewarded for requesting evidence may request unnecessary evidence. An agent rewarded for resolving cases quickly may prematurely close difficult cases. An agent rewarded for passing tests may learn to manipulate the tests. This creates a central tension: denser feedback can improve credit assignment while increasing the reward’s attack surface."
        - paragraph [ref=e294]:
          - text: "Process supervision is a more careful alternative. Rather than rewarding every click or tool call, an evaluator can check whether important parts of the trajectory were correct: did the agent identify the relevant policy, collect the required evidence, respect authorization boundaries, and use the available evidence before making its final decision? Two agents can reach the same answer while taking very different paths—one investigating correctly and the other guessing—so a useful evaluator should distinguish"
          - code [ref=e295]:
            - text: R
            - subscript [ref=e296]: outcome
          - text: from
          - code [ref=e297]:
            - text: R
            - subscript [ref=e298]: process
          - text: .
        - heading "Delayed consequences" [level=3] [ref=e299]
        - paragraph [ref=e300]: Long-horizon environments become especially interesting when an action’s consequences are not immediately visible. An agent may approve an unusual exception in the first hour, a customer may proceed based on that approval several hours later, and a compliance system may flag the case only near the end of the task. The first action looked locally reasonable; its cost appeared thirteen hours later.
        - paragraph [ref=e301]: "The environment therefore needs to preserve causal information across time. Otherwise, training sees only a bad ending without enough structure to identify which earlier decision created it. This is the practical form of long-horizon credit assignment: connecting a delayed outcome to the actions, observations, and state transitions that produced it."
        - heading "Reward hacking" [level=3] [ref=e302]
        - paragraph [ref=e303]: Reward hacking occurs when an agent increases the measured reward without accomplishing what the environment designer intended. A coding agent told to make the tests pass might fix the implementation—or disable the test. The measured result is the same, but the underlying outcome is completely different.
        - paragraph [ref=e304]:
          - text: This risk grows with capability. The same ability that helps an agent solve difficult tasks can help it discover weaknesses in the evaluator. In shorthand,
          - code [ref=e305]:
            - text: R
            - subscript [ref=e306]: proxy
            - text: ↑
          - text: while
          - code [ref=e307]:
            - text: R
            - subscript [ref=e308]: "true"
            - text: ↓
          - text: . Stronger verifiers reduce this gap, but they cannot eliminate it when the specification itself is incomplete.
        - heading "Why binary rewards are useful" [level=3] [ref=e309]
        - paragraph [ref=e310]: For long-horizon environments, my default is to keep the primary reward as close to binary and externally verifiable as possible. Richer signals can still be useful for diagnostics, curriculum construction, and carefully designed auxiliary objectives, but blindly combining many subjective scores creates more places where optimization can diverge from intent.
        - paragraph [ref=e311]:
          - text: The goal is not simply to make the reward binary. It is to make success binary when possible and make the verifier difficult to game. That means testing the verifier itself with hidden state, adversarial cases, held-out checks, independent evaluators, and sometimes multiple forms of verification. The
          - link "reward hacking discussion" [ref=e312] [cursor=pointer]:
            - /url: https://www.youtube.com/watch?v=lvMMZLYoDr4
          - text: is a useful reminder of this failure mode before designing the reward rather than after training exposes it.
        - paragraph [ref=e313]: For long-horizon RL, the hardest problem may eventually be less about producing reward and more about ensuring that the reward still means what we think it means after an agent has had thousands of opportunities to optimize against it.
        - heading "How to Build a 12-Hour Environment" [level=2] [ref=e314]
        - paragraph [ref=e315]:
          - text: "A twelve-hour environment should not be implemented as one process that stays alive for twelve hours. Most of the time, the agent will be waiting: for a CI job, a user reply, an experiment, an approval, or an external event. A more robust architecture is a durable environment that can"
          - strong [ref=e316]: wake, act, checkpoint, sleep, and resume
          - text: .
        - figure [ref=e317]:
          - img "Diagram showing an agent connected to an environment server with tool interfaces, a state store, and an event scheduler feeding a persistent world, checkpoints, external events, trajectories, and evaluators." [ref=e318]
        - heading "Environment server" [level=3] [ref=e319]
        - paragraph [ref=e320]:
          - text: The environment server owns the episode lifecycle. It should expose operations such as
          - code [ref=e321]: reset()
          - text: ","
          - code [ref=e322]: observe()
          - text: ","
          - code [ref=e323]: act()
          - text: ","
          - code [ref=e324]: advance_time()
          - text: ","
          - code [ref=e325]: checkpoint()
          - text: ","
          - code [ref=e326]: restore()
          - text: ", and"
          - code [ref=e327]: evaluate()
          - text: . The server—not the model—decides what state exists, what the agent is allowed to observe, which tools are available, what events are pending, whether the episode has finished, and when evaluation runs.
        - paragraph [ref=e328]:
          - text: This separation also makes the environment reproducible. The same initial state should be able to generate another rollout from the same checkpoint. Frameworks such as
          - link "Harbor" [ref=e329] [cursor=pointer]:
            - /url: https://www.harborframework.com/docs/core-concepts
          - text: use this kind of separation between an agent and an isolated environment, allowing the same world to support evaluation, RL rollouts, and trajectory generation.
        - heading "State store" [level=3] [ref=e330]
        - paragraph [ref=e331]:
          - text: Anything that matters after a restart must live outside transient model execution. A twelve-hour coding task may need to persist an episode identifier, repository commit, open pull request, current plan, pending CI job, received messages, created artifacts, remaining budget, and completed actions. You do not need to save every Python variable; you need enough information to reconstruct
          - code [ref=e332]:
            - text: S
            - subscript [ref=e333]: t
          - text: after a crash or sleep period.
        - paragraph [ref=e334]:
          - text: "The rule is simple: if losing it would change what the agent should do next, persist it. This is the same design pressure behind durable state in production agent runtimes such as"
          - link "Cloudflare Agents" [ref=e335] [cursor=pointer]:
            - /url: https://developers.cloudflare.com/agents/concepts/durable-objects/
          - text: ", where state survives restarts and hibernation."
        - heading "Event scheduler" [level=3] [ref=e336]
        - paragraph [ref=e337]: "A twelve-hour environment needs an actual concept of future time. The scheduler might create events such as a CI job completing in ten minutes, a customer replying in forty-five minutes, a document arriving in two hours, or an approval window closing in ten hours. The world is therefore not only updated by the agent:"
        - code [ref=e339]:
