          - text: is the expert action. A successful long trajectory can therefore be decomposed into thousands of supervised decisions.
          - link "Thinking Machines’ Tinker" [ref=e381] [cursor=pointer]:
            - /url: https://thinkingmachines.ai/tinker/
          - text: is one example of a programmable interface for SFT and RL workflows.
