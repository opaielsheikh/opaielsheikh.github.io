        - heading "Where trajectories come from" [level=3] [ref=e385]
        - paragraph [ref=e386]: "Trajectory data can come from human experts, strong frontier models, production traces, search systems, planning systems, or successful RL rollouts. A teacher can run inside the environment, after which the verifier filters the results:"
        - code [ref=e388]: teacher → environment → successful trajectories → SFT → better agent
        - paragraph [ref=e389]:
          - text: This creates a flywheel. The agent improves the trajectory dataset, and the improved dataset produces a stronger agent.
          - link "Prime Intellect" [ref=e390] [cursor=pointer]:
            - /url: https://www.primeintellect.ai/
          - text: is relevant because its Verifiers ecosystem combines datasets, harnesses, tools, sandboxes, and reward functions for evaluation, synthetic data generation, and RL training.
        - heading "Reinforcement learning" [level=3] [ref=e391]
        - paragraph [ref=e392]: "SFT teaches the model to imitate trajectories that already exist. RL is useful when we want it to discover better trajectories:"
        - code [ref=e394]: policy → rollout → environment → trajectory → verifier → reward → policy update → repeat
        - paragraph [ref=e395]: "The difficulty is hidden inside the rollout. In a twelve-hour environment it may involve thousands of actions, asynchronous events, memory compression, checkpoints, external tools, failures, resets, and delayed rewards. Scaling long-horizon RL is therefore partly a systems problem: the trainer must coordinate the policy, environment server, trajectory store, verifier, and recovery logic."
        - heading "Offline and off-policy reuse" [level=3] [ref=e396]
        - paragraph [ref=e397]: Long trajectories are expensive. If an episode consumes twelve hours of simulated work, throwing it away after one update is wasteful. Offline learning lets the trainer reuse a fixed dataset, including failures. An agent may perform well for six hours before making one catastrophic decision; the partial success and failure point are both useful.
        - generic [ref=e398]:
          - code [ref=e399]: "{ \"trajectory_id\": \"episode-8821\", \"policy_version\": \"v17\", \"final_reward\": 0, \"steps\": 784, \"failure\": {\"step\": 623, \"type\": \"premature_commitment\"}, \"checkpoint_rewards\": [[100, 1], [300, 1], [600, 1], [623, 0]] }"
          - button "Copy code" [ref=e400] [cursor=pointer]
        - paragraph [ref=e401]: These trajectories can support SFT on successful subsequences, preference learning, value-function training, failure classification, critic training, reranking, distillation, and counterfactual analysis. A twelve-hour rollout should be treated more like a dataset than a disposable sample.
        - paragraph [ref=e402]:
          - text: Offline and off-policy learning are related but not identical. Offline learning uses a fixed dataset. Off-policy learning trains the current policy using trajectories generated by another policy,
          - code [ref=e403]:
            - text: τ ~ π
            - subscript [ref=e404]: old
          - text: ", while optimizing"
          - code [ref=e405]:
            - text: π
            - subscript [ref=e406]: new
          - text: . This matters when rollout generation is slow and a useful trajectory is several policy versions old.
        - heading "On-policy distillation" [level=3] [ref=e407]
        - paragraph [ref=e408]: On-policy distillation offers a useful middle ground. SFT provides dense supervision but is off-policy; RL is on-policy but often has only a sparse final reward. With on-policy distillation, the student visits its own states and mistakes while a stronger teacher provides a denser signal on those same trajectories.
        - code [ref=e410]: SFT RL teacher trajectory student trajectory → student imitates → final reward dense, off-policy on-policy, sparse ON-POLICY DISTILLATION student trajectory → teacher evaluates student states → dense, on-policy supervision
        - paragraph [ref=e411]: This is especially interesting for long-horizon agents because the teacher can provide information about where a student trajectory went wrong without requiring a reward for every token or tool call.
        - heading "Curriculum by horizon length" [level=3] [ref=e412]
        - paragraph [ref=e413]: Do not begin with twelve hours. Start with five minutes, then fifteen minutes, one hour, three hours, six hours, and finally twelve hours—or increase the action horizon from 10 to 50, 200, 500, and 1,000 or more steps. The model first learns the local rules of the world; then we increase the time for which it must remain coherent.
        - generic [ref=e414]:
          - code [ref=e415]: "curriculum = [20, 50, 150, 500, 1500] for max_steps in curriculum: env.set_max_steps(max_steps) while not ready_to_advance(policy, env): trajectories = collect_rollouts(policy, env) policy = rl_update(policy, trajectories)"
          - button "Copy Python" [ref=e416] [cursor=pointer]
        - paragraph [ref=e417]:
          - text: An adaptive curriculum can promote the model when evaluation success passes a threshold, such as
          - code [ref=e418]: "if eval_success_rate > 0.80: horizon *= 2"
          - text: . Short horizons teach mechanics, medium horizons teach planning, long horizons teach persistence, and very long horizons expose delayed consequences.
        - heading "Hierarchical credit assignment" [level=3] [ref=e419]
        - paragraph [ref=e420]:
          - text: "At very long horizons, one reward attached to the entire episode is often not enough to explain what happened. A twelve-hour task naturally contains a hierarchy: verify coverage, collect evidence, investigate inconsistencies, communicate with the claimant, and produce a final decision. Instead of treating the trajectory only as"
