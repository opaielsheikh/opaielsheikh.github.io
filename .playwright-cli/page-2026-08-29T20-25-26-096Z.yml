          - text: .
        - paragraph [ref=e157]: For example, an insurance environment might internally know that a document is fraudulent, but the agent should receive only conflicting timestamps, an invoice, an email, and vehicle telemetry. It must investigate rather than read the answer from a hidden label. This separation between state, observation, and belief makes the benchmark more realistic and creates room to evaluate information gathering, uncertainty, and recovery from an incorrect hypothesis.
        - heading "Composing the architectures" [level=3] [ref=e158]
        - paragraph [ref=e159]: These architectures are not mutually exclusive. A serious long-horizon system may use prompt-local state for the current thought, persistent storage for plans and checkpoints, distributed services for the real world, and partial observability to prevent the agent from receiving privileged information. The model reasons over observations, while durable infrastructure owns the state that must survive.
        - paragraph [ref=e160]: "That is the deeper shift: the architecture of long-horizon agents begins to resemble distributed systems more than chat applications. The model supplies reasoning and action selection, but the surrounding system supplies continuity, synchronization, access control, recovery, and a record of consequences."
        - heading "Memory for Hours- and Days-Long Tasks" [level=2] [ref=e161]
        - paragraph [ref=e162]: A long-horizon agent cannot keep every observation, tool result, intermediate plan, and artifact in active context. Over a twelve-hour or three-day trajectory, the history can grow far beyond what should be placed in one prompt. The memory problem is therefore not remembering everything. It is preserving what will matter later, retrieving it at the right moment, and revising information that has become stale.
        - paragraph [ref=e163]:
          - text: "The context window is best understood as working memory: the small amount of information the agent is actively reasoning over right now. It may contain the current objective, the immediate plan, recent observations, temporary hypotheses, and the next few actions. If"
          - code [ref=e164]:
            - text: M
            - subscript [ref=e165]: t
          - text: is everything the agent could potentially remember, then its working memory is only a selected subset,
          - code [ref=e166]:
            - text: W
            - subscript [ref=e167]: t
            - text: ⊂ M
            - subscript [ref=e168]: t
          - text: . The context window should contain what the agent needs now, not everything that has ever happened.
        - figure [ref=e169]:
          - img "Diagram showing working memory connected to long-term episodic, semantic, and artifact memory, with compression into an archive or log." [ref=e170]
        - heading "Episodic, semantic, and artifact memory" [level=3] [ref=e171]
        - paragraph [ref=e172]:
          - text: "Episodic memory records what happened: a request was sent, a customer replied, an experiment failed, or a task was escalated. A useful event can be represented as"
          - code [ref=e173]:
            - text: e
            - subscript [ref=e174]: i
            - text: = (time, action, observation, outcome)
          - text: . This lets an agent later ask why it made a decision, whether it already tried a strategy, or what happened after an earlier action.
        - paragraph [ref=e175]:
          - text: Semantic memory stores what the agent learned rather than the complete path that produced it. “At 14:05, the customer confirmed the vehicle was repaired in London” is episodic; “vehicle repair location = London” is semantic. Facts, policies, relationships, preferences, discovered constraints, and conclusions belong here. In systems such as
          - link "Mem0" [ref=e176] [cursor=pointer]:
            - /url: https://mem0.ai/
          - text: ", persistent memories are separated from the active context and retrieved when they become relevant. Benchmarks such as"
          - link "LongMemEval" [ref=e177] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2410.10813
          - text: make this retrieval problem measurable across long, multi-session histories.
        - paragraph [ref=e178]:
          - text: Artifact memory is different again. Long-running agents create code, reports, spreadsheets, patches, diagrams, experiment outputs, and research notes. These should not all be copied into the prompt. Instead, the agent can store a pointer and metadata such as
          - code [ref=e179]: artifact_id
          - text: ","
          - code [ref=e180]: location
          - text: ","
          - code [ref=e181]: purpose
          - text: ", and"
          - code [ref=e182]: status
          - text: . Long-horizon memory is partly about remembering information and partly about remembering where important information lives.
        - heading "Compression and retrieval" [level=3] [ref=e183]
        - paragraph [ref=e184]: "The naive architecture sends the entire history into the context window. A scalable architecture continuously writes important information to long-term memory and retrieves only what is relevant to the current decision:"
        - code [ref=e186]: raw history → episodes → facts and artifacts → retrieved working context
        - paragraph [ref=e187]:
          - text: The two fundamental operations are
          - code [ref=e188]:
            - text: write(M
            - subscript [ref=e189]: t
            - text: ", x"
            - subscript [ref=e190]: t
            - text: )
          - text: and
          - code [ref=e191]:
            - text: retrieve(M
            - subscript [ref=e192]: t
            - text: ", q"
            - subscript [ref=e193]: t
            - text: )
          - text: . The difficult part is deciding what deserves to be written, what should be compressed, and what must be retrieved now. A memory layer may use a service such as
          - link "Redis" [ref=e194] [cursor=pointer]:
            - /url: https://redis.io/solutions/ai/
          - text: ", Mem0, a database, or a combination of stores. The important architectural idea is not the vendor: memory becomes an active process of selection, compression, retrieval, update, and forgetting rather than a passive transcript."
        - paragraph [ref=e195]: For long-horizon agents, forgetting is as important as remembering. A useful memory system must decide what survives, what becomes stale, what should be updated when evidence conflicts, and what belongs only in the archive. The goal is not perfect recall. It is maintaining the smallest reliable representation of the past needed to make good decisions about the future.
        - heading "Tool and Action Architectures" [level=2] [ref=e196]
        - paragraph [ref=e197]: The tool interface determines what kind of agent is actually being trained. An API agent, a browser agent, and a desktop agent may be asked to solve the same business problem, but they operate in very different environments. The interface changes the difficulty, the kinds of errors that are possible, and what it means for an action to change the world.
        - figure [ref=e198]:
          - img "Diagram showing an agent routing actions through APIs, computer use, and a terminal into a sandboxed world, producing state changes and rewards." [ref=e199]
        - heading "APIs, computer use, and sandboxes" [level=3] [ref=e200]
        - paragraph [ref=e201]:
          - text: APIs are the cleanest action interface. A tool such as
          - code [ref=e202]: get_claim(id)
          - text: ","
          - code [ref=e203]: update_claim(id, status)
          - text: ", or"
          - code [ref=e204]: send_email(to, body)
          - text: exposes a system’s capabilities directly. Calls are easy to validate, replay, and score, which makes them useful for reinforcement learning.
          - link "τ-bench" [ref=e205] [cursor=pointer]:
            - /url: https://github.com/sierra-research/tau-bench
          - text: "is a useful example: agents interact with tools and simulated users while following policies in customer-service workflows."
        - paragraph [ref=e206]:
          - text: Computer-use environments remove that abstraction. Instead of calling a perfect function, the agent receives screenshots and acts through mouse movement, clicks, typing, scrolling, and keyboard shortcuts. It must decide both what to do and how to physically accomplish it.
          - link "OpenAI’s Computer-Using Agent" [ref=e207] [cursor=pointer]:
            - /url: https://openai.com/index/computer-using-agent/
          - text: ","
          - link "WebArena" [ref=e208] [cursor=pointer]:
            - /url: https://webarena.dev/
          - text: ", and"
          - link "OSWorld" [ref=e209] [cursor=pointer]:
            - /url: https://os-world.github.io/
          - text: show why interface navigation introduces many more opportunities for error than a structured API.
        - code [ref=e211]: "API agent calls: update_customer(123) COMPUTER USE agent must: open CRM → find customer → navigate tabs → edit field → save → verify"
        - paragraph [ref=e212]:
          - text: "Researchers therefore increasingly use sandboxed copies of applications and systems: websites, Linux terminals, repositories, databases, desktop apps, and simulated enterprise software."
          - link "Harbor" [ref=e213] [cursor=pointer]:
            - /url: https://www.harborframework.com/docs/core-concepts
          - text: "is especially relevant because it treats a task as an instruction, an isolated environment, and a verifier. A sandbox turns software into a trainable world: it makes exploration safer, supports parallel rollouts, and allows the environment to be reset to the same initial state."
        - paragraph [ref=e214]:
          - text: "That reset is essential for RL. After each rollout, the system should be able to restore the world and run another agent from the same starting point:"
          - code [ref=e215]:
            - text: reset(S
            - subscript [ref=e216]: t
            - text: ) → S
            - subscript [ref=e217]: "0"
          - text: . This gives researchers reproducibility, controlled failures, hidden state, and deterministic verification without requiring agents to operate on live production systems.
        - heading "Hybrid environments" [level=3] [ref=e218]
        - paragraph [ref=e219]: Long-horizon agents will rarely use one interface exclusively. An agent might use an API to retrieve thousands of customer records, a browser to inspect a legacy system with no API, and a terminal to analyze the result inside a sandbox. A software engineer may move through GitHub, a terminal, an IDE, a browser, and Slack during one task. The strongest environments will let the agent choose not only what action to take, but which interface is appropriate for taking it.
        - heading "Irreversible actions" [level=3] [ref=e220]
