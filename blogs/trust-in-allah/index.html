  <style>
    :root {
      --bg-color: #fbf9f5;
      --text-main: #1b1b1b;

      --border-color: #eae6df;

    * {

    body {

      color: var(--text-main);

      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 4.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;

    .container {

      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-back a:hover {
      color: var(--text-main);
    }

    /* Blog Header */
    .blog-header {
      margin-bottom: 2.5rem;
    }

    .blog-title {
      font-family: var(--font-serif);
      font-size: 2.6rem;

      letter-spacing: -0.01em;

      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #9a948a;
      letter-spacing: 0.02em;
    }

    /* Content Area */
    .blog-content {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      line-height: 1.6;
      color: #333;
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }

    .question-highlight {
      font-style: italic;
      color: var(--text-main);
    }

    /* Bottom Back Link */
    .bottom-nav {
      margin-top: 3.5rem;
      margin-bottom: 3.5rem;
    }

    .bottom-nav a {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--accent-color);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: #e2a691;
      transition: color 0.15s ease;
    }

    .bottom-nav a:hover {
      color: var(--text-main);
      text-decoration-color: var(--text-main);
    }

    /* Footer */
    footer.social-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }

    footer.social-links a {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer.social-links a:hover {
      color: var(--text-main);
    }

    @media (max-width: 640px) {
      body {
        padding: 2.5rem 1.25rem;
      }
      .blog-title {
        font-size: 1.9rem;
      }
      .blog-content {
